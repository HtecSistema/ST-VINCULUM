<script>
// VALIDADOR DE COMBO - MANTIDO COMO VOCE FEZ
(function(){
  var jaPesquisou=false;
  window.__OPCOES_VALIDAS = {};
  function toast(m){
    if(typeof showToast==='function'){ showToast(m); return; }
    var t=document.getElementById('toast'); if(t){ t.textContent=m; t.className='toast show'; t.style.display='block'; setTimeout(function(){t.style.display='none';},4000);} else alert(m);
  }
  function norm(s){ return (s||'').toString().trim().toUpperCase().replace(/\s+/g,' '); }
  function coletarOpcoes(){
    document.querySelectorAll('[id^="list_"]').forEach(function(list){
      var idInput = list.id.replace('list_','');
      var ops = Array.from(list.children).map(function(o){return norm(o.textContent||o.innerText);}).filter(Boolean);
      if(ops.length>0){
        if(!__OPCOES_VALIDAS[idInput]) __OPCOES_VALIDAS[idInput]=new Set();
        ops.forEach(function(o){ __OPCOES_VALIDAS[idInput].add(o); });
      }
    });
  }
  var obs = new MutationObserver(function(){ coletarOpcoes(); });
  document.querySelectorAll('[id^="list_"]').forEach(function(l){ obs.observe(l, {childList:true}); });
  setInterval(coletarOpcoes, 500);
  function ehValido(id, valor){
    var v=norm(valor); if(!v) return true;
    var set = __OPCOES_VALIDAS[id];
    if(!set || set.size===0){
      var el=document.getElementById('list_'+id);
      if(el){ var tmp=Array.from(el.children).map(function(o){return norm(o.textContent);}).filter(Boolean); if(tmp.length>0) return tmp.indexOf(v)!==-1; }
      return true;
    }
    return set.has(v);
  }
  function validarTodos(){
    var combos=document.querySelectorAll('.combo-input');
    for(var i=0;i<combos.length;i++){
      var inp=combos[i]; var val=inp.value; if(!val) continue;
      if(!ehValido(inp.id, val)){
        toast('❌ "'+val+'" NÃO existe em '+inp.id+'. Onde tem ▼ só pode escolher da lista.');
        inp.value=''; inp.style.border='2px solid #ef4444'; inp.style.background='#fef2f2';
        inp.focus();
        return false;
      }
    }
    return true;
  }
  document.addEventListener('focusout', function(e){
    if(e.target.classList.contains('combo-input')){
      setTimeout(function(){
        if(e.target.value &&!ehValido(e.target.id, e.target.value)){
          toast('⚠️ "'+e.target.value+'" inválido em '+e.target.id+'. Escolha da lista ▼');
          e.target.value='';
        }
      },150);
    }
  }, true);
  document.addEventListener('click', function(e){
    var btn=e.target.closest('.btn-save');
    if(btn &&!validarTodos()){ e.preventDefault(); e.stopImmediatePropagation(); e.stopPropagation(); }
  }, true);
  var t=0; var iv=setInterval(function(){
    t++; coletarOpcoes();
    if(typeof window.salvar==='function' &&!window.salvar._travado){
      var orig=window.salvar;
      window.salvar=function(){
        coletarOpcoes();
        if(!validarTodos()) return false;
        return orig.apply(this, arguments);
      };
      window.salvar._travado=true;
      clearInterval(iv);
    }
    if(t>150) clearInterval(iv);
  },300);
  function autoPesquise(){
    if(jaPesquisou) return; jaPesquisou=true;
    try{
      var ml=(document.getElementById('MatriculaLogin')?.value||localStorage.getItem('mat_logada')||'').trim();
      if(ml){ var im=document.getElementById('Matricula'); if(im &&!im.value) im.value=ml.replace(/\D/g,'').padStart(5,'0'); }
      if(typeof buscarMatriculaBD1==='function') buscarMatriculaBD1();
      else { var b=document.getElementById('btnPesquiseMat'); if(b) b.click(); }
    }catch(e){}
  }
  window.addEventListener('load', function(){ setTimeout(function(){ coletarOpcoes(); autoPesquise(); },900); });
  setTimeout(function(){ if(!jaPesquisou) autoPesquise(); },1800);
  setTimeout(function(){ if(!jaPesquisou) autoPesquise(); },3000);
})();
</script>

<!-- UNICA MUDANCA JS - 7 CAMPOS PRINCIPAIS -->
<script>
function verificarDadosCompletos(){
  var obrig = ['Sexo','Nascimento','Congregacao','BatizadoAgua','EspSanto','TFunEclesiastica','Fcongregacao'];
  for(var i=0;i<obrig.length;i++){
    var el=document.getElementById(obrig[i]);
    if(!el) continue;
    if(!(el.value||'').trim()) return false;
  }
  return true;
}
function atualizarStatusDados(){
  var box=document.getElementById('statusDados');
  if(!box) return false;
  var ok=verificarDadosCompletos();
  box.textContent = ok? '✅ Dados completos' : '⚠️ Dados incompletos';
  box.className = ok? 'status-completo' : 'status-incompleto';
  return ok;
}
function mostrarModalDados(t){
  var txt=document.getElementById('modalTexto');
  var tit=document.getElementById('modalTitulo');
  var m=document.getElementById('meuModal');
  if(txt) txt.textContent=t;
  if(tit) tit.textContent='Atenção';
  if(m) m.style.display='flex';
}
setInterval(atualizarStatusDados,800);
window.addEventListener('load',function(){setTimeout(atualizarStatusDados,1000);});
(function(){
  var tent=0;
  var iv=setInterval(function(){
    tent++;
    if(typeof window.abrirTeste52==='function' &&!window.abrirTeste52._comTravamento){
      var orig=window.abrirTeste52;
      window.abrirTeste52=function(){
        if(!verificarDadosCompletos()){
          atualizarStatusDados();
          mostrarModalDados('Os dados estão incompletos');
          return false;
        }
        return orig.apply(this, arguments);
      };
      window.abrirTeste52._comTravamento=true;
      clearInterval(iv);
    }
    if(tent>200) clearInterval(iv);
  },300);
})();
</script>
