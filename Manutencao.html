<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manutenção - Htec ST-VINCULUM</title>
<link rel="stylesheet" href="Manutencao.css">
</head>
<body>
<div style="padding:16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; border-bottom:1px solid #1f1f28">
  <div style="display:flex; align-items:center; gap:12px">
    <div style="width:42px;height:42px;background:linear-gradient(135deg,#f59e0b,#ea580c);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px">🚀</div>
    <div>
      <div style="color:#fff; font-weight:900; font-size:14px">LANÇAR MANUTENÇÃO</div>
      <div style="color:#71717a; font-size:9px; letter-spacing:1px">NIVEL GALAXY • PLANILHA Manutencao</div>
    </div>
  </div>
  <div style="display:flex; gap:8px; align-items:center">
    <span id="totalManutNovo" style="color:#f59e0b; font-weight:800; font-size:11px">0 REGISTROS</span>
    <button onclick="carregarManutencaoNova()" style="background:#1f1f28; border:1px solid #333; border-radius:8px; padding:6px 10px; color:#fff; font-size:11px; cursor:pointer">↻</button>
    <span id="msgManutNovo" style="color:#22c55e; font-size:11px; font-weight:700; margin-left:8px"></span>
  </div>
</div>
<div class="grid-manut">
  <div style="background:#0f0f14; padding:16px; border-radius:14px; border:1px solid #222; height:fit-content">
    <div style="display:grid; gap:10px">
      <div><label style="color:#f59e0b;font-size:10px;font-weight:900">COD</label><input id="mCodNovo" placeholder="001" style="width:100%;margin-top:4px;background:#15151d;border:1px solid #2a2a3a;border-radius:10px;padding:14px;color:#fff;outline:none;font-size:16px"></div>
      <div><label style="color:#f59e0b;font-size:10px;font-weight:900">TIPO DE CICLO</label><select id="mTipoNovo" style="width:100%;margin-top:4px;background:#15151d;border:1px solid #2a2a3a;border-radius:10px;padding:14px;color:#fff;font-size:15px"><option value="SISTEMA GERAL">🚨 SISTEMA GERAL - BLOQUEIA TODOS</option><option>CICLO 01</option><option>CICLO 02</option><option>CICLO 03</option><option>CICLO 04</option><option>CICLO 05</option><option>CICLO 06</option><option>CICLO 07</option><option>CICLO 08</option></select></div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
        <div><label style="color:#f59e0b;font-size:10px;font-weight:900">DATA INICIO</label><input id="mInicioNovo" type="date" style="width:100%;margin-top:4px;background:#15151d;border:1px solid #2a2a3a;border-radius:10px;padding:14px;color:#fff;font-size:14px"></div>
        <div><label style="color:#f59e0b;font-size:10px;font-weight:900">DATA FINAL</label><input id="mFinalNovo" type="date" style="width:100%;margin-top:4px;background:#15151d;border:1px solid #2a2a3a;border-radius:10px;padding:14px;color:#fff;font-size:14px"></div>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px">
        <div><label style="color:#f59e0b;font-size:10px;font-weight:900">HORARIO</label><input id="mHoraNovo" type="time" style="width:100%;margin-top:4px;background:#15151d;border:1px solid #2a2a3a;border-radius:10px;padding:14px;color:#fff;font-size:14px"></div>
        <div><label style="color:#f59e0b;font-size:10px;font-weight:900">STATUS</label><select id="mStatusNovo" style="width:100%;margin-top:4px;background:#15151d;border:1px solid #f59e0b;border-radius:10px;padding:14px;color:#fff;font-weight:700;font-size:13px"><option>EM MANUTENCAO</option><option>ATIVO</option><option>CONCLUIDO</option><option>EM OBSERVAÇÃO</option></select></div>
      </div>
    </div>
    <div class="botoes-manut">
      <button onclick="limparFormManutNovo()" style="background:#1f1f28; border:1px solid #2a2a3a; border-radius:10px; padding:14px; color:#a1a1aa; font-weight:800; cursor:pointer; font-size:11px">🧹 LIMPAR</button>
      <button onclick="excluirTudoManutNovo()" style="background:#2a1515; border:1px solid #7f1d1d; border-radius:10px; padding:14px; color:#f87171; font-weight:800; cursor:pointer; font-size:11px">🗑️ EXCLUIR</button>
      <button onclick="lancarManutencaoNova()" id="btnLancarManut" style="background:linear-gradient(90deg,#f59e0b,#ea580c); border:0; border-radius:10px; padding:14px; color:#000; font-weight:900; cursor:pointer; font-size:11px">🚀 SALVAR</button>
    </div>
  </div>
  <div style="background:#0f0f14; border-radius:14px; border:1px solid #222; overflow:hidden; display:flex; flex-direction:column">
    <!-- 👇 AQUI COLOCA O CAMPO DE PESQUISA - EM CIMA DA TABELA -->
    <div style="padding:10px 12px; display:flex; gap:8px; background:#0a0a0f; border-bottom:1px solid #1f1f28">
      <input id="buscaManutNovo" oninput="filtrarManutNova()" placeholder="🔍 PESQUISAR COD, CICLO, STATUS..." style="flex:1;background:#15151d;border:1px solid #2a2a3a;border-radius:8px;padding:10px 12px;color:#fff;font-size:12px;outline:none">
      <button onclick="document.getElementById('buscaManutNovo').value='';filtrarManutNova()" style="background:#1f1f28;border:1px solid #333;border-radius:8px;padding:0 12px;color:#a1a1aa;cursor:pointer">✕</button>
    </div>
    <!-- FIM DA PESQUISA -->

    <div id="wrapTabelaManut">
      <table style="width:100%; border-collapse:collapse; font-size:11px; color:#d4d4d8">
        <thead style="position:sticky; top:0; background:#15151d; z-index:1">
          <tr style="text-align:left; color:#71717a; font-size:9px"><th style="padding:10px; border-bottom:1px solid #222">COD</th><th style="padding:10px; border-bottom:1px solid #222">CICLO</th><th style="padding:10px; border-bottom:1px solid #222">INICIO</th><th style="padding:10px; border-bottom:1px solid #222">FINAL</th><th style="padding:10px; border-bottom:1px solid #222">HORA</th><th style="padding:10px; border-bottom:1px solid #222">STATUS</th><th style="padding:10px; border-bottom:1px solid #222">AÇAO</th></tr>
        </thead>
        <tbody id="tbodyManutNovo"></tbody>
      </table>
    </div>
    <div style="padding:8px 12px; background:#0a0a0f; border-top:1px solid #1f1f28; color:#52525b; font-size:9px; text-align:center">👆 Toque na linha pra editar • ENTER destaca • Mobile: arrasta pro lado</div>
  </div>
</div>
<script src="Manutencao.js"></script>
</body>
</html>
