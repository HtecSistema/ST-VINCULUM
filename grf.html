<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Gráficos - Acompanhamento ao VIVO</title>
<link rel="stylesheet" href="grf.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
<div id="modalGraficos" style="display:flex;flex-direction:column;height:100vh;background:#f1f5f9;font-family:system-ui">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid #e2e8f0;flex-wrap:wrap;gap:8px">
    <div style="font-weight:900;font-size:18px">📊 Gráficos - Acompanhamento ao VIVO</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span id="gStatus" style="font-size:12px;color:#64748b"></span>
      <span id="gCount" style="font-size:12px;font-weight:700"></span>
      <button onclick="gRecarregarTudo()" style="background:#0f172a;color:#fff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer">🔄 Atualizar</button>
      <button onclick="imprimirGraficos()" style="background:#fff;border:1px solid #e2e8f0;padding:7px 12px;border-radius:8px;cursor:pointer">🖨 Imprimir</button>
      <button onclick="fecharGraficos()" style="background:#fff;border:1px solid #e2e8f0;padding:7px 12px;border-radius:8px;cursor:pointer">✕ Fechar</button>
    </div>
  </div>
  <div style="padding:10px 16px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <label style="font-size:12px;font-weight:700">BUSCA POR MATRÍCULA:</label>
    <input id="gMat" placeholder="Ex: 12345" style="border:1px solid #e2e8f0;border-radius:8px;padding:7px 10px;font-size:13px">
    <button onclick="gBuscar()" style="background:#0f172a;color:#fff;border:none;padding:7px 12px;border-radius:8px;cursor:pointer">Buscar</button>
    <button onclick="gLimpar()" style="background:#fff;border:1px solid #e2e8f0;padding:7px 12px;border-radius:8px;cursor:pointer">Limpar</button>
    <span id="gInfo" style="font-size:12px;color:#64748b"></span>
  </div>
  <div style="padding:0 16px"><div id="gPbar" style="height:6px;background:#0f172a;border-radius:99px;width:0%;margin:10px 0"></div></div>
  <div id="gDebug" style="margin:0 16px 8px;font-size:12px;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px"></div>
  <div id="gDetalhe" style="margin:0 16px 8px;font-size:12px"></div>
  <div id="gWrap" style="flex:1;overflow:auto"></div>
  <div id="gFoot" style="padding:8px 16px;font-size:11px;color:#64748b;background:#fff;border-top:1px solid #e2e8f0"></div>
</div>
<script src="grf.js"></script>
</body>
</html>
